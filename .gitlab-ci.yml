
variables:
  IN_CI_ENV: "1"
  DOCKER_TLS_CERTDIR: ""
  BUILDX_NO_DEFAULT_ATTESTATIONS: "1"

stages:
 - tests
 - deploy

golangci-lint:
  image: gitlab.int.magneato.site:4567/dungar/test-image:latest
  stage: tests
  script:
    - make ci_lint

go-vet:
  image: gitlab.int.magneato.site:4567/dungar/test-image:latest
  stage: tests
  script:
    - make vet

main-test:
  image: gitlab.int.magneato.site:4567/dungar/test-image:latest
  stage: tests
  script:
    - make test

race-test:
  image: gitlab.int.magneato.site:4567/dungar/test-image:latest
  stage: tests
  script:
    - make race

msan-test:
  image: gitlab.int.magneato.site:4567/dungar/test-image:latest
  stage: tests
  script:
    - make msan

coverage-test:
  image: gitlab.int.magneato.site:4567/dungar/test-image:latest
  stage: tests
  script:
    - make coverage
  coverage: '/total:\s+\(statements\)\s+\d+.\d+%/'

deploy_local:
  image: gitlab.int.magneato.site:4567/dungar/test-image:latest
  stage: deploy
  environment:
    name: local_production
  script:
    - make build
    - bash tools/deploy_script.sh
  only:
    - main
